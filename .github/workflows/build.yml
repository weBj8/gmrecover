# Builds gmsv_gmrecover for all four Garry's Mod server branches.
# Tags `v*` also publish a release with the DLLs and the Lua addon.
name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: host
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - gmod: linux
            target: i686-unknown-linux-gnu
            cargo: zigbuild
            triple: i686-unknown-linux-gnu.2.17
            file: libgmrecover.so
          - gmod: linux64
            target: x86_64-unknown-linux-gnu
            cargo: zigbuild
            triple: x86_64-unknown-linux-gnu.2.17
            file: libgmrecover.so
          - gmod: win32
            target: i686-pc-windows-msvc
            cargo: xwin build
            triple: i686-pc-windows-msvc
            file: gmrecover.dll
          - gmod: win64
            target: x86_64-pc-windows-msvc
            cargo: xwin build
            triple: x86_64-pc-windows-msvc
            file: gmrecover.dll
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.gmod }}
      - uses: mlugg/setup-zig@v2
        if: matrix.cargo == 'zigbuild'
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.24.0,cargo-xwin@0.23.1
      # cc-rs needs llvm-lib on PATH.
      # i686 needs lld-link >= 19 for /export EXPORTAS.
      - name: Install LLVM 20
        if: matrix.cargo != 'zigbuild'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-20 lld-20 clang-20
          llvm_bin=/usr/lib/llvm-20/bin
          test -x "$llvm_bin/llvm-lib"
          echo "$llvm_bin" >> "$GITHUB_PATH"
      - name: Cache MSVC CRT/SDK (cargo-xwin)
        if: matrix.cargo != 'zigbuild'
        uses: actions/cache@v6
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-${{ runner.os }}-${{ matrix.target }}-0.23.1
      - name: Build
        env:
          RUSTFLAGS: ""
          XWIN_ARCH: x86,x86_64
        run: >-
          cargo ${{ matrix.cargo }} --release --locked
          --target ${{ matrix.triple }}
      - name: Rename to GMod module name
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.file }}" \
            "dist/gmsv_gmrecover_${{ matrix.gmod }}.dll"
      - uses: actions/upload-artifact@v7
        with:
          name: gmsv_gmrecover_${{ matrix.gmod }}
          path: dist/*.dll
          if-no-files-found: error
          compression-level: 9

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Pack Lua addon
        run: zip -r dist/gmrecover-addon.zip lua
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
