[package]
name = "gmrecover"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crc32fast = "1.5"
rsgdll = { git = "https://github.com/weBj8/rsgdll.git", rev = "e7edbecdf798acf566748e3a443f2d227bd703f3" }
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"

[features]
default = ["server"]
# Declared because rsgdll macros emit cfgs for them; this module is server-only.
client = []
menu = []
server = []

[profile.release]
opt-level = 3
debug = "line-tables-only"
lto = "thin"
panic = "unwind"
codegen-units = 1
